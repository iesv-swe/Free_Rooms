<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Städlogg</title>
    <link rel="icon" href="ies.ico" type="image/x-icon">
    <style>
        :root {
            --color-bg: #f4f7f6;
            --color-card: #ffffff;
            --color-border: #e0e0e0;
            --color-text-primary: #2c3e50;
            --color-text-secondary: #5a7a9b;
            --color-text-header: #34495e;
            --color-link: #2980b9;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: var(--font-main); background: var(--color-bg); color: var(--color-text-primary); padding: 16px; }
        #header { display: flex; align-items: center; gap: 16px; max-width: 1000px; margin: 0 auto 16px; }
        #logo-img { height: 48px; width: auto; mix-blend-mode: multiply; }
        h1 { margin: 0; font-size: 1.8rem; color: var(--color-text-header); flex: 1; }
        a.back { color: var(--color-link); text-decoration: none; font-weight: 600; border: 1px solid currentColor; border-radius: 6px; padding: 6px 12px; white-space: nowrap; }
        #content { max-width: 1000px; margin: 0 auto; }
        .day { background: var(--color-card); border: 1px solid var(--color-border); border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 14px; overflow: hidden; }
        .day h2 { margin: 0; padding: 12px 16px; font-size: 1.15rem; border-bottom: 1px solid var(--color-border); display: flex; justify-content: space-between; gap: 12px; }
        .day h2 .count { color: var(--color-text-secondary); font-weight: 600; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; }
        .chip { display: flex; gap: 8px; align-items: baseline; background: #eef1f3; border-radius: 8px; padding: 6px 12px; }
        .chip b { font-size: 1.05rem; }
        .chip span { color: var(--color-text-secondary); font-variant-numeric: tabular-nums; }
        .empty { text-align: center; color: var(--color-text-secondary); padding: 40px 0; font-size: 1.1rem; }
        .note { max-width: 1000px; margin: 20px auto 0; color: var(--color-text-secondary); font-size: 0.85rem; text-align: center; }
    </style>
</head>
<body>
    <div id="header">
        <img id="logo-img" src="logo.png" alt="Skolans logotyp" onerror="this.style.display='none'">
        <h1>Städlogg</h1>
        <a class="back" href="index.html">&larr; Lediga rum</a>
    </div>

    <div id="content"></div>
    <div class="note">Loggen sparas i den här webbläsaren och visar de senaste 90 dagarna.</div>

    <script>
        const LOG_KEY = 'freeRooms.log';

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function readLog() {
            try { const a = JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; }
        }

        function formatDate(iso) {
            const [y, m, d] = iso.split('-').map(Number);
            const text = new Date(y, m - 1, d).toLocaleDateString('sv-SE', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            return text.charAt(0).toUpperCase() + text.slice(1);
        }

        function todayIso() {
            const n = new Date(new Date().toLocaleString("en-US", { timeZone: "Europe/Stockholm" }));
            return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`;
        }

        function render() {
            const content = document.getElementById('content');
            const log = readLog();
            if (log.length === 0) {
                content.innerHTML = '<div class="empty">Inga städade rum har loggats ännu.</div>';
                return;
            }
            const byDate = {};
            for (const e of log) (byDate[e.date] = byDate[e.date] || []).push(e);
            const collator = new Intl.Collator('sv', { numeric: true });
            const today = todayIso();
            content.innerHTML = Object.keys(byDate).sort().reverse().map(date => {
                const entries = byDate[date].sort((a, b) => (a.time || '').localeCompare(b.time || '') || collator.compare(a.room, b.room));
                const title = formatDate(date) + (date === today ? ' (idag)' : '');
                const chips = entries.map(e => `<div class="chip"><b>${escapeHtml(e.room)}</b><span>${escapeHtml(e.time || '')}</span></div>`).join('');
                return `<div class="day"><h2><span>${escapeHtml(title)}</span><span class="count">${entries.length} städade rum</span></h2><div class="chips">${chips}</div></div>`;
            }).join('');
        }

        render();
    </script>
</body>
</html>
